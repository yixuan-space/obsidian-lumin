name: Validate theme CSS

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: npm ci

      - name: Build and validate distributable CSS
        run: |
          npm run build
          npm run test:hotkeys
          npm run check:size
          git diff --check
          git diff --exit-code -- theme.css

      - name: Audit palette contrast
        if: runner.os == 'macOS'
        run: npm run audit:contrast

      - name: Validate macOS launcher
        if: runner.os == 'macOS'
        run: |
          bash -n tools/typora-hotkeys/Start.command
          test -x tools/typora-hotkeys/Start.command
          node tools/typora-hotkeys/launch-macos.mjs --check
